# Project
license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedUtil/issues
# Every mod in this repo. Each one is a folder under mods.
family_name=Assorted Util
# The family every mod here joins, as each one's Constants.FAMILY_ID also says.
family_id=assortedutil
assorted_mods=util,graves,doubledoors,itemreplacer,time,lightoverlay,damagenumbers
# Build
# The AssortedBuild version these mods use. It sets the Minecraft, NeoForge and Fabric versions.
assortedbuild_version=26.2.6
# Mod Options
mod_author=Grim3212
# The lowest Assorted Lib version these mods work with.
assortedlib_version=4.3.0
# Build options. Leaving one out turns it off. A mod can turn one on in its own gradle.properties.
jei_enabled=false
neoforge_ats_enabled=false
common_runs_enabled=false
# The default release channel. Can be release, beta or alpha.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
